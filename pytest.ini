[pytest]
# O virtualenv vive na raiz do projeto, então sem `testpaths` o pytest coleta
# os testes das bibliotecas dentro de lib/ e lib64/.
testpaths = tests
norecursedirs = bin include lib lib64 share perfil_navegador
# Torna o pacote `monitor` importável com o comando `pytest` puro, não só
# com `python -m pytest` (que já coloca o diretório atual no sys.path).
pythonpath = .
